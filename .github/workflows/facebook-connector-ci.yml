name: Facebook connector
on:
  pull_request:
    paths: ["facebook-connector/**", "phantomblog/**", ".github/workflows/facebook-connector-ci.yml"]
  push:
    branches: [main]
    paths: ["facebook-connector/**", "phantomblog/**", ".github/workflows/facebook-connector-ci.yml"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Synthetic connector tests
        working-directory: facebook-connector
        run: python -m unittest discover -s tests -v
      - name: PhantomBlog integration tests
        working-directory: phantomblog
        run: python -m unittest discover -s tests -v
      - name: Compile connector
        working-directory: facebook-connector
        run: python -m compileall -q facebook_connector
