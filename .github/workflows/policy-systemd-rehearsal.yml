name: Disposable policy systemd rehearsal
on:
  workflow_dispatch:
  pull_request:
    paths: ['phantomdocs/**', 'phantomorg/**', '.github/workflows/policy-systemd-rehearsal.yml']
permissions:
  contents: read
jobs:
  disposable-systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise real systemd using a separate root-owned publisher runtime
        working-directory: phantomdocs
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /proc/1/comm)" = systemd
          sudo apt-get update -qq
          sudo apt-get install -y acl nodejs python3-venv
          test -x /usr/bin/node
          trial_root=$(sudo mktemp -d /var/lib/pd-policy-ci-XXXXXXXX)
          cleanup() {
            sudo /usr/bin/python3 -c 'import pathlib,shutil,sys; p=pathlib.Path(sys.argv[1]); assert p.parent==pathlib.Path("/var/lib") and p.name.startswith("pd-policy-ci-") and p.resolve()==p; shutil.rmtree(p)' "$trial_root"
          }
          trap cleanup EXIT
          sudo /usr/bin/python3 -m venv "$trial_root/venv"
          sudo "$trial_root/venv/bin/python" -m pip install --quiet --report "$trial_root/install-report.json" '.[dev]' ../phantomorg
          sudo /usr/bin/python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("Disposable runtime sources:"); [print(json.dumps({"name": p["metadata"]["name"], "version": p["metadata"]["version"], "source": p["download_info"]}, sort_keys=True)) for p in r["install"]]' "$trial_root/install-report.json"
          sudo env PHANTOM_POLICY_SYSTEMD_TRIAL=1 "PHANTOM_POLICY_TRIAL_PYTHON=$trial_root/venv/bin/python" \
            "PYTHONPATH=$PWD/src:$PWD/tests" PYTHONDONTWRITEBYTECODE=1 \
            GITHUB_ACTIONS=true "$trial_root/venv/bin/python" -m pytest tests/test_policy_operations_systemd.py tests/test_notify_adapter_linux.py tests/test_disabled_alert_systemd.py tests/test_matrix_deadline_systemd.py tests/test_matrix_overlay_integrated_systemd.py -v
